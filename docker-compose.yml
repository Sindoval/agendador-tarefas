version: '3.8'

services:
  agendador-app:
    build: .
    container_name: agendador-tarefas-app
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/db_agendador
      USUARIO_URL: http://usuario:8081/usuario
      TZ: "America/Sao_Paulo"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: